<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#03260e"/>
      <stop offset="60%" stop-color="#010a04"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000000" opacity="0.35"/>
    </pattern>
    <clipPath id="winClip">
      <rect x="30" y="20" width="1140" height="260" rx="10"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- terminal window -->
  <rect x="30" y="20" width="1140" height="260" rx="10" fill="#010802" fill-opacity="0.9" stroke="#00ff41" stroke-width="1.5" filter="url(#glow)"/>

  <g clip-path="url(#winClip)">
    <!-- title bar -->
    <rect x="30" y="20" width="1140" height="32" fill="#04200d"/>
    <line x1="30" y1="52" x2="1170" y2="52" stroke="#00ff41" stroke-width="1" opacity="0.6"/>
    <circle cx="56" cy="36" r="6" fill="#166534"/>
    <circle cx="78" cy="36" r="6" fill="#22c55e"/>
    <circle cx="100" cy="36" r="6" fill="#86efac"/>
    <text x="600" y="41" text-anchor="middle" font-family="Courier New, Consolas, monospace" font-size="14" fill="#4ade80" opacity="0.85">root@aayush:~/portfolio &#8212; bash</text>

    <!-- falling code columns (right side) -->
    <g font-family="Courier New, Consolas, monospace" font-size="15" fill="#00ff41">
      <text x="930" y="70" opacity="0.28">
        <tspan x="930" dy="0">1</tspan><tspan x="930" dy="18">0</tspan><tspan x="930" dy="18">1</tspan><tspan x="930" dy="18">1</tspan><tspan x="930" dy="18">0</tspan><tspan x="930" dy="18">A</tspan><tspan x="930" dy="18">F</tspan><tspan x="930" dy="18">0</tspan><tspan x="930" dy="18">1</tspan><tspan x="930" dy="18">7</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-30;0,30;0,-30" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="985" y="60" opacity="0.2">
        <tspan x="985" dy="0">0</tspan><tspan x="985" dy="18">x</tspan><tspan x="985" dy="18">4</tspan><tspan x="985" dy="18">1</tspan><tspan x="985" dy="18">1</tspan><tspan x="985" dy="18">0</tspan><tspan x="985" dy="18">E</tspan><tspan x="985" dy="18">9</tspan><tspan x="985" dy="18">0</tspan><tspan x="985" dy="18">1</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,20;0,-20;0,20" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="1040" y="70" opacity="0.32">
        <tspan x="1040" dy="0">1</tspan><tspan x="1040" dy="18">1</tspan><tspan x="1040" dy="18">0</tspan><tspan x="1040" dy="18">C</tspan><tspan x="1040" dy="18">0</tspan><tspan x="1040" dy="18">1</tspan><tspan x="1040" dy="18">D</tspan><tspan x="1040" dy="18">1</tspan><tspan x="1040" dy="18">0</tspan><tspan x="1040" dy="18">3</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-25;0,25;0,-25" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="1095" y="65" opacity="0.22">
        <tspan x="1095" dy="0">0</tspan><tspan x="1095" dy="18">1</tspan><tspan x="1095" dy="18">B</tspan><tspan x="1095" dy="18">0</tspan><tspan x="1095" dy="18">1</tspan><tspan x="1095" dy="18">0</tspan><tspan x="1095" dy="18">F</tspan><tspan x="1095" dy="18">1</tspan><tspan x="1095" dy="18">0</tspan><tspan x="1095" dy="18">8</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,15;0,-35;0,15" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- command line 1 -->
    <text x="70" y="80" font-family="Courier New, Consolas, monospace" font-size="20" fill="#4ade80">$ whoami</text>

    <!-- title -->
    <text x="70" y="150" font-family="Courier New, Consolas, monospace" font-size="62" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="3">AAYUSH SHARMA</text>

    <!-- subtitle -->
    <text x="70" y="192" font-family="Courier New, Consolas, monospace" font-size="19" fill="#d1fae5" letter-spacing="1"><tspan fill="#00ff41">&gt;</tspan> AI / ML ENGINEER &#8212; TURNING DATA INTO INTELLIGENCE</text>

    <!-- status line -->
    <text x="70" y="226" font-family="Courier New, Consolas, monospace" font-size="15" fill="#00ff41" opacity="0.8">[ OK ] python &#183; pytorch &#183; langgraph &#183; fastapi &#183; streamlit</text>

    <!-- prompt + blinking cursor -->
    <text x="70" y="260" font-family="Courier New, Consolas, monospace" font-size="20" fill="#4ade80">$ ./build_intelligence.sh</text>
    <rect x="340" y="243" width="12" height="20" fill="#00ff41">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- scanlines + moving scan bar -->
    <rect x="30" y="20" width="1140" height="260" fill="url(#scan)"/>
    <rect x="30" y="-20" width="1140" height="40" fill="#00ff41" opacity="0.07">
      <animate attributeName="y" values="-20;280" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
